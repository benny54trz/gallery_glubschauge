name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull upstream changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/open-noodle/gallery.git
          git fetch upstream
          
          # Sicherstellen, dass wir auf dem main-Branch sind
          git checkout main || git checkout -b main upstream/main
          
          # Merge durchführen (Non-Fast-Forward oder direkt übernehmen)
          git merge upstream/main --no-edit
          
          # Änderungen zurück zu GitHub pushen
          git push origin main
